services:
  postgres:
    image: postgres:16-alpine
    container_name: graphql-training-db
    environment:
      POSTGRES_USER: graphql
      POSTGRES_PASSWORD: graphql
      POSTGRES_DB: graphql_training
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphql -d graphql_training"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
